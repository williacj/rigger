# ABOUTME: Codex's declaration for this repository: the sandbox and network a Codex session Rigger
# dispatches runs under, and the tools and connectors it may use. Rigger's Codex adapter copies it
# into each dispatch's own Codex home as that home's config.toml, where Codex reads it untrusted.

# A session writes in its working directory and in each directory a judge reaches (`--add-dir`),
# which Codex ignores under `read-only`. The temporary directories are left out, so nothing outside
# those roots is writable.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# On, so `gh pr comment` and the rest of `gh` can reach the forge from the sandbox.
network_access = true
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

# The MCP servers a session may use, each as an `[mcp_servers.<name>]` table. None is declared, so a
# session has none. Plugins and connected apps are off for every Rigger session, whatever this file
# says, because the adapter passes `--disable plugins` and `--disable apps`.
