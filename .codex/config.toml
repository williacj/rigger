# ABOUTME: Codex's declaration for this repository: its sessions run unsandboxed, and this file
# declares the tools and connectors they may use. Rigger's Codex adapter copies it
# into each dispatch's own Codex home as that home's config.toml, where Codex reads it untrusted.

# This repository's pre-commit suite needs process-table reads, which Codex's workspace-write
# sandbox refuses on macOS. Makers and judges therefore run unsandboxed (M7-U42, #1237).
# A Codex setting allowing process reads and setuid exec under workspace-write would reverse this.
sandbox_mode = "danger-full-access"

[sandbox_workspace_write]
# This table is inert under danger-full-access.
network_access = true
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

# The MCP servers a session may use, each as an `[mcp_servers.<name>]` table. None is declared, so a
# session has none. Plugins and connected apps are off for every Rigger session, whatever this file
# says, because the adapter passes `--disable plugins` and `--disable apps`.
