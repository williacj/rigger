      await append(env.GITHUB_OUTPUT, 'host_outcome=' + host.outcome + '\nhost_exit_code=' + host.exitCode + '\n');
      startup ??= child.startup;
      const ioFailures = child.ioFailures ?? [];
      // A trusted capture descriptor identifies the qualified prefix of complete original stdout.
      let hostKey;
      if (startup?.capture?.state === 'complete') {
        let stdout;
        try { stdout = new TextDecoder('utf-8', { fatal: true }).decode(child.stdout); }
        catch { /* Invalid stdout leaves the key unavailable; report parsing remains independent. */ }
        const prefixBytes = Buffer.from(startup.stdoutPrefix, 'utf8');
        if (stdout !== undefined && child.stdout.subarray(0, prefixBytes.length).equals(prefixBytes)) {
          const start = startup.stdoutPrefix.length, end = stdout.indexOf('\n', start);
          if (end > start) hostKey = stdout.slice(start, end);
        }
      }
      const finish = async reporting => {
        let summaryMessage;
        if (host.outcome === 'failure') {
          const summary = reporting.state === 'valid'
            ? reporting.failedNames.length > 0
              ? '## Failed host tests\n\n```json\n' + JSON.stringify(reporting.failedNames, null, 2) + '\n```\n'
              : '## Host test report\n\nHost step failed without a reported test failure.\n'
            : '## Host test report\n\nJUnit report is ' + reporting.state + '; failed-test names are unavailable.\n';
          if (Buffer.byteLength(summary, 'utf8') > 1_048_576) summaryMessage = 'Host summary exceeds 1048576 UTF-8 bytes';
          else await append(env.GITHUB_STEP_SUMMARY, summary);
        }
        return { host, hostKey, reporting, ioFailures,
          stepOutcome: summaryMessage !== undefined || reporting.outcome === 'failure' || ioFailures.length > 0 ? 'failure' : host.outcome,
          message: summaryMessage ?? (ioFailures.length > 0 ? 'Host ' + ioFailures[0].stream + ' ' + ioFailures[0].operation + ' failed' : undefined) };
      };
      let bytes;
      try { bytes = await read(join(env.RUNNER_TEMP, env.CI_HOST_REPORT_NAME)); }
      catch (error) {
        if (error.code !== 'ENOENT') throw error;
