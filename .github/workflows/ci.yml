# ABOUTME: Verifies staged CI, preserves invocation-bound host reports and records scheduled host failures.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  merge_group:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CI_POLICY: |
    import { appendFileSync, readFileSync } from 'node:fs';
    import { execFileSync } from 'node:child_process';
    const sha = (value) => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
    export function parseRaw(bytes) {
      const raw = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      if (raw === '') return [];
      const parts = raw.split('\0');
      if (parts.pop() !== '' || parts.length % 2 !== 0) throw new Error('incomplete raw Git diff');
      const changes = [];
      for (let index = 0; index < parts.length; index += 2) {
        const header = /^:(\d{6}) (\d{6}) ([a-f0-9]{7,40}) ([a-f0-9]{7,40}) ([AMDT])$/.exec(parts[index]);
        if (!header || parts[index + 1] === '') throw new Error('malformed raw Git diff');
        changes.push({ oldMode: header[1], newMode: header[2], status: header[5], path: parts[index + 1] });
      }
      return changes;
    }
    export function journalOnly(changes) {
      return Array.isArray(changes) && changes.length > 0 && changes.every((row) =>
        /^docs\/journal\/[A-Za-z0-9][A-Za-z0-9._-]*\.md$/.test(row?.path) &&
        ((row.status === 'A' && row.oldMode === '000000' && row.newMode === '100644') ||
         (row.status === 'M' && row.oldMode === '100644' && row.newMode === '100644')));
    }
    export function policy(f) {
      const invalid = { mode: 'INVALID', demoNeeded: false, sourceValid: false };
      if (f?.rawBase64 !== undefined) {
        try {
          const bytes = Buffer.from(f.rawBase64, 'base64');
          if (bytes.toString('base64') !== f.rawBase64) return invalid;
          f = { ...f, changes: parseRaw(bytes) };
        } catch { return invalid; }
      }
      if (!f || f.owner !== 'williacj' || f.complete !== true || !f.checkout || !sha(f.eventSha) || f.checkout.sha !== f.eventSha || !sha(f.checkout.tree) || !Array.isArray(f.checkout.parents) || !f.checkout.parents.every(sha) || !Array.isArray(f.changes)) return invalid;
      if (['push', 'schedule', 'workflow_dispatch', 'merge_group'].includes(f.event)) {
        if (!f.main || f.main.defaultBranch !== 'main' || !sha(f.main.head)) return invalid;
        if (f.event === 'merge_group') {
          if (!f.group || f.group.head !== f.checkout.sha || f.group.base !== f.main.head || f.group.baseRef !== 'refs/heads/main' || f.group.baseAncestor !== true) return invalid;
          return { mode: 'BROAD_EXECUTED', demoNeeded: true, sourceValid: true };
        }
        if (f.ref !== 'refs/heads/main' || f.main.head !== f.checkout.sha || (f.inputs && Object.keys(f.inputs).length > 0)) return invalid;
        if (f.event === 'push' && f.after !== f.checkout.sha) return invalid;
        return { mode: f.event === 'push' ? 'MAIN_SMOKE' : 'MAIN_FULL', demoNeeded: f.event !== 'push', sourceValid: true };
      }
      if (f.event !== 'pull_request' || !f.pr || !f.live || !f.main || f.main.defaultBranch !== 'main' || !sha(f.main.head)) return invalid;
      const { pr, live } = f;
      if (!['opened', 'synchronize', 'reopened', 'edited', 'ready_for_review', 'labeled', 'unlabeled'].includes(f.action) || typeof f.sender !== 'string' || !f.sender) return invalid;
      if (!Number.isSafeInteger(pr.number) || pr.number <= 0 || f.ref !== 'refs/pull/' + pr.number + '/merge' || !sha(pr.head) || !sha(pr.base) || !['open', 'closed'].includes(pr.state) || typeof pr.draft !== 'boolean' || typeof pr.baseRef !== 'string' || !pr.baseRef || !Array.isArray(live.labels) || !live.labels.every((name) => typeof name === 'string')) return invalid;
      if (pr.state !== 'open' || (pr.baseRef !== 'main' && pr.baseRef.toLowerCase() === 'main') || !sha(live.base) || !sha(pr.testedBase) || f.checkout.parents[0] !== pr.testedBase || (pr.baseRef !== 'main' && pr.base !== live.base) || ['head', 'baseRef', 'state', 'draft'].some((key) => pr[key] !== live[key]) || f.checkout.parents.length !== 2 || (pr.baseRef === 'main' ? (pr.testedBase !== pr.base && pr.eventBaseAncestor !== true) : pr.testedBase !== pr.base) || f.checkout.parents[1] !== pr.head) return invalid;
      if (!f.changes.every((row) => row && typeof row.path === 'string' && row.path.length > 0 && !row.path.includes(String.fromCharCode(0)) && /^[AMDRT]$/.test(row.status) && /^(000000|100644|100755|120000|160000)$/.test(row.oldMode) && /^(000000|100644|100755|120000|160000)$/.test(row.newMode))) return invalid;
      const ownerRequest = f.owner === 'williacj' && f.sender === f.owner && f.action === 'labeled' && live.labels.includes(f.label);
      const journal = journalOnly(f.changes);
      const irrelevantDemo = journal || (f.changes.length > 0 && f.changes.every((row) =>
        row.path === 'test/package-budget.test.mjs' &&
        ((row.status === 'A' && row.oldMode === '000000' && row.newMode === '100644') ||
         (row.status === 'M' && row.oldMode === '100644' && row.newMode === '100644'))));
      if (pr.baseRef === 'main' && !pr.draft && ownerRequest && f.label === 'ci:full') return { mode: 'BROAD_EXECUTED', demoNeeded: !irrelevantDemo, sourceValid: true };

      return { mode: pr.baseRef !== 'main' || journal ? 'FAST_ELIGIBLE' : 'BROAD_DEFERRED', demoNeeded: ownerRequest && f.label === 'ci:demo', sourceValid: true };
    }
    export async function requestJson(path, { send = fetch, token = process.env.GH_TOKEN, base = process.env.GITHUB_API_URL ?? 'https://api.github.com' } = {}) {
      const url = new URL(path, base);
      if (url.origin !== new URL(base).origin || !token) throw new Error('API scope unavailable');
      const response = await send(url.href, { method: 'GET', headers: { authorization: 'Bearer ' + token, accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(30_000) });
      if (!response.ok || /rel="next"/.test(response.headers.get('link') ?? '')) throw new Error('API status or pagination is incomplete');
      const bytes = new Uint8Array(await response.arrayBuffer());
      const length = response.headers.get('content-length');
      const encoding = response.headers.get('content-encoding');
      if (bytes.length > 2 * 1024 * 1024 || (length !== null && (!encoding || encoding === 'identity') && Number(length) !== bytes.length)) throw new Error('API body is incomplete');
      return JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
    }
    export async function collect(options = {}) {
      try {
        const event = options.event ?? JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
        const context = options.context ?? { eventName: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF, sha: process.env.GITHUB_SHA, repository: process.env.GITHUB_REPOSITORY, owner: process.env.GITHUB_REPOSITORY_OWNER };
        const run = options.run ?? ((args) => execFileSync('git', args, { timeout: 30_000, maxBuffer: 8 * 1024 * 1024 }));
        const request = options.request ?? requestJson;
        const text = (args) => new TextDecoder('utf-8', { fatal: true }).decode(run(args)).trim();
        if (context.owner !== 'williacj' || context.repository !== 'williacj/rigger' || event.repository?.full_name !== context.repository) throw new Error('repository scope mismatch');
        const repository = await request('/repos/' + context.repository);
        if (repository.full_name !== context.repository || repository.owner?.login !== context.owner || repository.default_branch !== 'main') throw new Error('current repository scope mismatch');
        const checkout = { sha: text(['rev-parse', 'HEAD']), tree: text(['rev-parse', 'HEAD^{tree}']), parents: text(['show', '-s', '--format=%P', 'HEAD']).split(/\s+/).filter(Boolean) };
        if (checkout.sha !== context.sha) throw new Error('checkout source mismatch');
        const sameRepository = Number.isSafeInteger(event.repository.id) && event.repository.id > 0 && event.pull_request?.head?.repo?.id === event.repository.id;
        const facts = { sameRepository, event: context.eventName, action: event.action, ref: context.ref, eventSha: context.sha, owner: context.owner, sender: event.sender?.login, label: event.label?.name, checkout, complete: false };
        if (['push', 'schedule', 'workflow_dispatch', 'merge_group'].includes(context.eventName)) {
          const current = await request('/repos/' + context.repository + '/git/ref/heads/main');
          facts.main = { head: current.object?.sha, defaultBranch: repository.default_branch };
          facts.inputs = event.inputs;
          facts.after = event.after;
          facts.changes = [];
          if (context.eventName === 'merge_group') {
            const group = event.merge_group;
            if (!group || !sha(group.base_sha) || !sha(group.head_sha)) throw new Error('merge-group source unavailable');
            run(['merge-base', '--is-ancestor', group.base_sha, checkout.sha]);
            facts.group = { head: group.head_sha, base: group.base_sha, baseRef: group.base_ref, baseAncestor: true };
            facts.changes = parseRaw(run(['diff', '--raw', '-z', '--no-renames', group.base_sha, checkout.sha]));
          } else if (context.eventName === 'push') {
            if (!sha(event.before)) throw new Error('push base unavailable');
            facts.changes = parseRaw(run(['diff', '--raw', '-z', '--no-renames', event.before, checkout.sha]));
          }
          facts.complete = true;
          return facts;
        }
        if (context.eventName !== 'pull_request' || !Number.isSafeInteger(event.number) || event.number <= 0) throw new Error('candidate PR facts unavailable');
        const current = await request('/repos/' + context.repository + '/pulls/' + event.number);
        const pr = event.pull_request;
        if (!pr || current.number !== event.number) throw new Error('incomplete current PR facts');
        const labels = await request('/repos/' + context.repository + '/issues/' + event.number + '/labels?per_page=100');
        if (!Array.isArray(labels) || !labels.every((label) => typeof label?.name === 'string')) throw new Error('incomplete current labels');
        const branch = await request('/repos/' + context.repository + '/git/ref/heads/' + current.base.ref.split('/').map(encodeURIComponent).join('/'));
        if (!sha(branch.object?.sha) || !sha(current.base.sha)) throw new Error('current base unavailable');
        if (current.base.ref !== 'main' && branch.object.sha !== current.base.sha) throw new Error('current base changed');
        const main = current.base.ref === 'main' ? branch : await request('/repos/' + context.repository + '/git/ref/heads/main');
        if (!sha(main.object?.sha)) throw new Error('current main unavailable');
        facts.main = { head: main.object.sha, defaultBranch: repository.default_branch };
        facts.pr = { number: event.number, head: pr.head.sha, base: pr.base.sha, testedBase: checkout.parents[0], baseRef: pr.base.ref, state: pr.state, draft: pr.draft };
        if (facts.pr.baseRef === 'main' && facts.pr.base !== facts.pr.testedBase) {
          if (!sha(facts.pr.base) || !sha(facts.pr.testedBase)) throw new Error('candidate base unavailable');
          run(['merge-base', '--is-ancestor', facts.pr.base, facts.pr.testedBase]);
          facts.pr.eventBaseAncestor = true;
        }
        facts.live = { head: current.head.sha, base: current.base.sha, baseRef: current.base.ref, state: current.state, draft: current.draft, labels: labels.map((label) => label.name) };
        facts.changes = parseRaw(run(['diff', '--raw', '-z', '--no-renames', facts.pr.testedBase, checkout.sha]));
        facts.complete = true;
        return facts;
      } catch (error) { return { complete: false, reason: String(error.message) }; }
    }
    // The checkout's own change list, read from Git alone: a pull request's merge against its first
    // parent. It holds where the forge API cannot answer, and is undefined where Git cannot.
    export function localChanges(run = (args) => execFileSync('git', args, { timeout: 30_000, maxBuffer: 8 * 1024 * 1024 })) {
      try {
        const text = (args) => new TextDecoder('utf-8', { fatal: true }).decode(run(args)).trim();
        const head = text(['rev-parse', 'HEAD']);
        const parents = text(['show', '-s', '--format=%P', 'HEAD']).split(/\s+/).filter(Boolean);
        if (!sha(head) || parents.length !== 2 || !parents.every(sha)) return undefined;
        return parseRaw(run(['diff', '--raw', '-z', '--no-renames', parents[0], head]));
      } catch { return undefined; }
    }
    export function source(f) {
      return { event: f.event, ref: f.ref, sha: f.checkout.sha, tree: f.checkout.tree, parents: f.checkout.parents, head: f.pr?.head ?? f.group?.head ?? f.checkout.sha, base: f.pr?.testedBase ?? f.group?.base ?? f.checkout.sha, baseRef: f.pr?.baseRef ?? f.group?.baseRef ?? 'main', ...(f.pr ? { eventBase: f.pr.base } : {}) };
    }
    export function guard(f, proof) {
      const fresh = policy(f);
      if (!fresh.sourceValid || proof.sourceValid !== true || proof.mode !== fresh.mode || proof.demoNeeded !== fresh.demoNeeded || JSON.stringify(proof.source) !== JSON.stringify(source(f))) return false;
      const results = proof.results ?? {};
      if (results.plan !== 'success' || results.fast !== 'success') return false;
      if (f.event === 'pull_request' && results.cancel_superseded !== 'success') return false;
      if (!['FAST_ELIGIBLE', 'MAIN_SMOKE', 'BROAD_EXECUTED', 'BROAD_DEFERRED'].includes(fresh.mode)) return false;
      const required = fresh.mode === 'BROAD_EXECUTED' ? 'success' : 'skipped';
      return results.full_ordinary === required && results.full_host === required && results.demo === (fresh.demoNeeded ? 'success' : 'skipped');
    }
    export function runPolicy({ action, facts, proof = {}, worker, macosRunner, changes } = {}) {
      const fresh = policy(facts);
      if (action === 'plan') {
        let runner = '"macos-latest"';
        if ((fresh.mode === 'BROAD_EXECUTED' || fresh.demoNeeded) && (facts?.event !== 'pull_request' || facts.sameRepository === true)) {
          runner = macosRunner || runner;
          if (!['"macos-latest"', '["self-hosted","macOS","ARM64"]'].includes(runner)) throw new Error('MACOS_RUNNER is outside the allowlist: ' + JSON.stringify(macosRunner));
        }
        return { ok: true, output: { runner, mode: fresh.mode, demoNeeded: fresh.demoNeeded, journalOnly: journalOnly(changes ?? facts?.changes), sha: fresh.sourceValid ? facts.checkout.sha : '', tree: fresh.sourceValid ? facts.checkout.tree : '', snapshot: fresh.sourceValid ? JSON.stringify(source(facts)) : '' } };
      }
      const verified = fresh.sourceValid && proof.sourceValid === true && proof.mode === fresh.mode && JSON.stringify(proof.source) === JSON.stringify(source(facts));
      if (action === 'worker') {
        const allowed = worker === 'fast' ? fresh.mode !== 'MAIN_FULL' && fresh.mode !== 'INVALID'
          : worker === 'full_ordinary' || worker === 'full_host' ? fresh.mode === 'BROAD_EXECUTED'
          : worker === 'demo' ? fresh.demoNeeded
          : worker === 'nightly' ? fresh.mode === 'MAIN_FULL' && ['schedule', 'workflow_dispatch'].includes(facts.event) && facts.ref === 'refs/heads/main'
          : false;
        return { ok: Boolean(verified && allowed && process.versions.node.split('.')[0] === '26'), source: fresh.sourceValid ? source(facts) : undefined, reason: 'worker source/mode verification failed' };
      }
      if (action === 'aggregate') return { ok: verified && guard(facts, proof), source: fresh.sourceValid ? source(facts) : undefined, testedBase: fresh.sourceValid ? source(facts).base : undefined, ...(facts?.pr ? { eventBase: facts.pr.base } : {}), currentMain: facts?.main?.head, mainAdvanced: fresh.sourceValid && facts.pr?.baseRef === 'main' ? facts.main.head !== facts.pr.testedBase : null, reason: 'current source or required tier result did not verify' };
      return { ok: false, reason: 'unknown policy action' };
    }
    export function workerHostOutputs(result, worker) {
      if (!result?.ok || !result.source || !['nightly', 'full_host'].includes(worker)) return {};
      return { host_source: JSON.stringify(result.source), host_eligible: String(worker === 'nightly' && result.source.event === 'schedule' && result.source.ref === 'refs/heads/main') };
    }
    if (process.env.CI_POLICY_ACTION) {
      const facts = await collect();
      let expected;
      try { expected = JSON.parse(process.env.CI_EXPECTED_SOURCE ?? 'null'); } catch { expected = null; }
      let results = {};
      try { results = Object.fromEntries(Object.entries(JSON.parse(process.env.CI_RESULTS ?? '{}')).map(([name, job]) => [name, job.result])); } catch { results = {}; }
      const result = runPolicy({ action: process.env.CI_POLICY_ACTION, facts, changes: process.env.CI_POLICY_ACTION === 'plan' ? localChanges() : undefined, macosRunner: process.env.CI_MACOS_RUNNER, worker: process.env.CI_WORKER, proof: { mode: process.env.CI_EXPECTED_MODE, demoNeeded: process.env.CI_EXPECTED_DEMO === 'true' ? true : process.env.CI_EXPECTED_DEMO === 'false' ? false : undefined, sourceValid: expected !== null, source: expected, results } });
      console.log(JSON.stringify({ job: process.env.GITHUB_JOB, mode: policy(facts).mode, source: result.source, testedBase: result.testedBase, eventBase: result.eventBase, currentMain: result.currentMain, mainAdvanced: result.mainAdvanced, node: process.version, platform: process.platform, runner: process.env.RUNNER_NAME, runnerOS: process.env.RUNNER_OS, runnerArch: process.env.RUNNER_ARCH }));
      if (result.output) for (const [key, value] of Object.entries(result.output)) appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + String(value) + '\n');
      if (!result.ok) throw new Error(result.reason);
      if (process.env.CI_POLICY_ACTION === 'worker') for (const [key, value] of Object.entries(workerHostOutputs(result, process.env.CI_WORKER))) appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + value + '\n');
    }

  CI_HOST: |
    import { spawn } from 'node:child_process';
    import { createRequire } from 'node:module';
    import { readFile, appendFile, writeFile, mkdir, access as accessFile, realpath as resolveRealPath } from 'node:fs/promises';
    import { constants } from 'node:fs';
    import { createHash } from 'node:crypto';
    import { homedir } from 'node:os';
    import { basename, delimiter, dirname, join, resolve } from 'node:path';
    const { SaxesParser } = createRequire(join(process.cwd(), 'package.json'))('saxes');
    async function inspectStartup(inspection = {}) {
      try {
        const { env = process.env, cwd = process.cwd(), scriptPath = process.argv[1], execPath = process.execPath,
          read = readFile, realpath = resolveRealPath, access = accessFile,
          fingerprint = async path => createHash('sha256').update(await read(path)).digest('hex') } = inspection;
        if (delimiter !== ':' || typeof env.PATH !== 'string' || !env.PATH) return;
        const routeOptions = new Set(['script-shell', 'node-options', 'workspace', 'workspaces', 'include-workspace-root', 'global', 'location', 'prefix', 'userconfig', 'globalconfig']);
        for (const [key, value] of Object.entries(env)) {
          if (!value) continue;
          if (['BASH_ENV', 'ENV', 'PREFIX', 'DESTDIR'].includes(key)) return;
          if (/^npm_config_/i.test(key) && routeOptions.has(key.slice('npm_config_'.length).replace(/(?!^)_/g, '-').toLowerCase())) return;
        }
        const argv = ['npm', 'run', 'test:host', '--', '--test-reporter=spec', '--test-reporter=junit', '--test-reporter-destination=stdout', '--test-reporter-destination=' + join(env.RUNNER_TEMP, env.CI_HOST_REPORT_NAME)];
        const script = "npm run test:host -- --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=\"$RUNNER_TEMP/$CI_HOST_REPORT_NAME\"";
        if (env.NODE_OPTIONS || !(await read(scriptPath)).equals(Buffer.from(script, 'utf8'))) return;
        const project = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(await read(join(cwd, 'package.json'))));
        if (project.scripts?.['test:host'] !== 'sh test/suite.sh --host' || Object.hasOwn(project.scripts, 'pretest:host') || Object.hasOwn(project.scripts, 'posttest:host') || Object.hasOwn(project, 'workspaces')) return;
        const locate = async command => {
          for (const directory of env.PATH.split(delimiter)) {
            const candidate = resolve(cwd, directory || '.', command);
            try { await access(candidate, constants.X_OK); }
            catch (error) {
              if (['ENOENT', 'EACCES', 'ENOTDIR'].includes(error.code)) continue;
              throw error;
            }
            return realpath(candidate);
          }
        };
        const npmCli = await locate('npm'), node = await locate('node');
        if (!npmCli || basename(npmCli) !== 'npm-cli.js' || node !== await realpath(execPath)) return;
        const npmRoot = dirname(dirname(npmCli));
        const npm = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(await read(join(npmRoot, 'package.json'))));
        if (npm.name !== 'npm' || !['11.20.0', '12.2.2'].includes(npm.version) || npm.bin?.npm !== 'bin/npm-cli.js') return;
        if (npm.version === '11.20.0' && (project.name !== '@williacj/rigger' || project.version !== '0.1.0')) return;
        for (const path of [join(npmRoot, 'npmrc'), join(env.HOME || homedir(), '.npmrc'), join(dirname(dirname(execPath)), 'etc/npmrc')]) {
          try { await read(path); return; }
          catch (error) { if (error.code !== 'ENOENT') return; }
        }
        const projectSources = {
          ".npmrc": "2ab58d679ddb6c245446999a2ea5fb54783b9aa26c94ce663cb7db0be0a8f7f8",
          "test/suite.sh": "d9ea1addc140aca1a33ab06bfa91a52c655810f79f8771bf12a21b45d78b2b71",
          "test/suite-guard.cjs": "11057fb99548ffdfb62cea550d6aa7fb99c310b232a544a9e809d0936ece5370"
        };
        for (const [path, expected] of Object.entries(projectSources)) if (await fingerprint(join(cwd, path)) !== expected) return;
        const npmSources = npm.version === '11.20.0' ? {
          "bin/npm-cli.js": "8e5f6f3429f8cdbe693cdc29904e9d5a7b127a494bd15c804bd54c7403bfcbe7",
          "lib/commands/run.js": "86080ad381490dd347b5cde5071a8d2444c1f471e795f4a88957e4726fca20ab",
          "node_modules/@npmcli/run-script/lib/run-script-pkg.js": "94dea9ff50028869f4f88c4ec5e520d56fa7c2f6cc03422a9f06c44d291a0c34",
          "lib/utils/display.js": "ec7af29eebcb43c362818ad2386518758a31692155f6363d8285182320972d8c",
          "node_modules/@npmcli/run-script/lib/make-spawn-args.js": "d1647624f0ce227e5cff1c4570f3e754e0eaaf08041db354102ec2bdbbd721df",
          "node_modules/@npmcli/config/lib/index.js": "938b85a17fde9f2355497fd4befc9bac45d406fb4afacd8af63322796697ff06",
          "node_modules/@npmcli/config/lib/definitions/definitions.js": "701d85fcce4a266cc60e7273ac2d1ee7a3feec56b16f5e4705aad9f00844f58f"
        } : {
          "bin/npm-cli.js": "8e5f6f3429f8cdbe693cdc29904e9d5a7b127a494bd15c804bd54c7403bfcbe7",
          "lib/commands/run.js": "b7acdea61c0886f048d2b8c5ecbce1599416eec6ba5553ee21d77687f50ccf8c",
          "node_modules/@npmcli/run-script/lib/run-script-pkg.js": "1142ab865b1180409f0f3a93eb3bc01f9ca36fa9ead1c938b254eb6923de7886",
          "lib/utils/display.js": "c6268a43166143f3a833b95be55080dfa44e370ae7bab39dbf943816d3a11450",
          "node_modules/@npmcli/run-script/lib/make-spawn-args.js": "51ef6919950dc6e87dfa1b0824fe2f1dcd423f2e3a5b2632b8a076120b8bd7b4",
          "node_modules/@npmcli/config/lib/index.js": "14e19ddd8378da6554aa6c84e420e14547db217f4d9759b4149b77f5dafa778a",
          "node_modules/@npmcli/config/lib/definitions/definitions.js": "b352635a4b9ac0575a76e66dae679b16c67762030b1847564ea4b59e572f8372"
        };
        for (const [path, expected] of Object.entries(npmSources)) if (await fingerprint(join(npmRoot, path)) !== expected) return;
        return { argv, npmVersion: npm.version,
          stdoutPrefix: npm.version === '11.20.0' ? '\n> @williacj/rigger@0.1.0 test:host\n> sh test/suite.sh --host ' + argv.slice(4).join(' ') + '\n\n' : '' };
      } catch { return; }
    }
    export async function executeScript({ spawnChild = spawn, stdoutSink = process.stdout, stderrSink = process.stderr, inspection, onStart } = {}) {
      const profile = await inspectStartup(inspection);
      return new Promise((resolve, reject) => {
        const child = spawnChild('bash', ['-e', process.argv[1]], { stdio: ['inherit', 'pipe', 'pipe'] });
        const stdout = [], stderr = [];
        let startDone = onStart === undefined, startFailure = false;
        if (onStart) {
          try {
            Promise.resolve(onStart({ pid: child.pid, argv: ['bash', '-e', process.argv[1]] }, profile)).then(() => { startDone = true; finishHost(); }, () => { startFailure = true; startDone = true; finishHost(); });
          } catch { startFailure = true; startDone = true; }
        }
        let stdoutEnded = false, stdoutReadError = false, stderrReadError = false, stdoutWriteError = false, stderrWriteError = false;
        let pendingStdoutWrites = 0, hostClosed = false, hostExitCode, hostSignal, stdoutCallbackError = false, stdoutErrorNotified = false, stdoutClosed = false;
        let pendingStderrWrites = 0, stderrCallbackError = false, stderrErrorNotified = false, stderrClosed = false;
        const resumeStdout = () => { child.stdout.resume(); };
        const resumeStderr = () => { child.stderr.resume(); };
        const failStdoutWrite = () => {
          stdoutWriteError = true;
          stdoutSink.removeListener?.('drain', resumeStdout);
          resumeStdout();
        };
        const onStdoutWriteError = () => { stdoutErrorNotified = true; failStdoutWrite(); finishHost(); };
        const onStdoutClose = () => {
          stdoutClosed = true;
          if (!stdoutSink.writableFinished) failStdoutWrite();
          finishHost();
        };
        stdoutSink.on?.('error', onStdoutWriteError);
        stdoutSink.on?.('close', onStdoutClose);
        child.stdout.on('data', bytes => {
          stdout.push(bytes);
          if (stdoutWriteError) return;
          pendingStdoutWrites += 1;
          const accepted = stdoutSink.write(bytes, error => {
            pendingStdoutWrites -= 1;
            if (error) { stdoutCallbackError = true; failStdoutWrite(); }
            finishHost();
          });
          if (accepted === false) {
            child.stdout.pause();
            stdoutSink.once('drain', resumeStdout);
          }
        });
        child.stdout.on('end', () => { stdoutEnded = true; });
        child.stdout.on('error', () => { stdoutReadError = true; });
        const failStderrWrite = () => {
          stderrWriteError = true;
          stderrSink.removeListener?.('drain', resumeStderr);
          resumeStderr();
        };
        const onStderrWriteError = () => { stderrErrorNotified = true; failStderrWrite(); finishHost(); };
        const onStderrClose = () => {
          stderrClosed = true;
          if (!stderrSink.writableFinished) failStderrWrite();
          finishHost();
        };
        stderrSink.on?.('error', onStderrWriteError);
        stderrSink.on?.('close', onStderrClose);
        child.stderr.on('data', bytes => {
          stderr.push(bytes);
          if (stderrWriteError) return;
          pendingStderrWrites += 1;
          const accepted = stderrSink.write(bytes, error => {
            pendingStderrWrites -= 1;
            if (error) { stderrCallbackError = true; failStderrWrite(); }
            finishHost();
          });
          if (accepted === false) {
            child.stderr.pause();
            stderrSink.once('drain', resumeStderr);
          }
        });
        child.stderr.on('error', () => { stderrReadError = true; });
