    if (process.env.CI_HOST_ACTION === 'run') {
      const result = await runHost();
      if (result.stepOutcome !== 'success') {
        console.error(result.reporting?.message ?? result.message ?? 'Host command failed');
        process.exitCode = 1;
      }
    }

  CI_RECORD: |
    export async function issueRequest(path, { method = 'GET', body, token = process.env.GH_TOKEN, send = fetch, signal = AbortSignal.timeout(30_000), log = entry => console.log(JSON.stringify(entry)) } = {}) {
      if (!token || !/^\/repos\/williacj\/(?:rigger|rigger-ci-fixture)\/issues(?:\/[1-9][0-9]*(?:\/comments)?)?(?:\?state=open&labels=host-tier&per_page=100|\?per_page=100)?$/.test(path) || !['GET', 'POST'].includes(method)) throw new Error('Issues API scope unavailable');
      const response = await send('https://api.github.com' + path, {
        method, redirect: 'error', signal,
        headers: { authorization: 'Bearer ' + token, accept: 'application/vnd.github.raw+json', ...(body === undefined ? {} : { 'content-type': 'application/json' }) },
        ...(body === undefined ? {} : { body: JSON.stringify(body) }),
      });
      log({ method, path, status: response.status, date: response.headers.get('date') });
      if (response.redirected || response.url && new URL(response.url).origin !== 'https://api.github.com') throw new Error('Issues API redirect refused');
      const bytes = new Uint8Array(await response.arrayBuffer());
      const length = response.headers.get('content-length'), encoding = response.headers.get('content-encoding');
      if (length !== null && (!encoding || encoding === 'identity') && (!/^[0-9]+$/.test(length) || Number(length) !== bytes.length)) throw new Error('Issues API body incomplete');
      return { status: response.status, body: JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes)), link: response.headers.get('link') };
    }
    export async function recordHostFailure({ input, request = issueRequest }) {
      if (input.event !== 'schedule' || input.ref !== 'refs/heads/main' || input.eligible === 'false' || input.host_invoked === 'false' || input.host_outcome === 'success') return { state: 'skipped' };
      let key;
      try { key = JSON.parse(input.host_key); } catch { throw new Error('Missing host key for scheduled host failure'); }
      if (typeof key !== 'string' || key.length === 0) throw new Error('Missing host key for scheduled host failure');
      const refuseTransport = () => { throw new Error('Host record transport missing, malformed, redacted or unavailable'); };
      let source, names, invocation;
      try { source = JSON.parse(input.source); names = JSON.parse(input.failed_names); invocation = JSON.parse(input.invocation); } catch { refuseTransport(); }
      const sha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
      const positive = value => Number.isSafeInteger(value) && value > 0;
      if (!['williacj/rigger', 'williacj/rigger-ci-fixture'].includes(input.repository) || input.eligible !== 'true' || input.host_invoked !== 'true' || input.host_outcome !== 'failure'
        || !(input.host_exit_code === 'null' || typeof input.host_exit_code === 'string' && /^[1-9][0-9]*$/.test(input.host_exit_code) && positive(Number(input.host_exit_code)))) refuseTransport();
      if (!source || source.event !== 'schedule' || source.ref !== 'refs/heads/main' || !sha(source.sha) || !sha(source.tree)
        || !Array.isArray(source.parents) || !source.parents.every(sha) || source.head !== source.sha || source.base !== source.sha || source.baseRef !== 'main') refuseTransport();
      if (!invocation || !positive(input.runId) || !positive(input.runAttempt) || input.job !== 'nightly'
        || invocation.repository !== input.repository || invocation.runId !== input.runId || invocation.runAttempt !== input.runAttempt || invocation.job !== input.job) refuseTransport();
      if (!['valid', 'absent', 'unparsable'].includes(input.report_state)) refuseTransport();
      if (input.report_state === 'valid'
        ? input.names_state !== 'available' || !Array.isArray(names) || !names.every(name => typeof name === 'string')
        : input.names_state !== 'unavailable' || names !== null) refuseTransport();
      const marker = '<!-- t4-host-invocation ' + JSON.stringify(invocation) + ' -->';
      const recorded = text => text.split('\n').filter(line => line.startsWith('<!-- t4-host-invocation ')).map(line => {
        const match = /^<!-- t4-host-invocation (.*) -->$/.exec(line);
        let previous;
        try { previous = match && JSON.parse(match[1]); } catch { /* Refuse malformed reserved identity records below. */ }
        if (!previous || typeof previous.repository !== 'string' || !positive(previous.runId) || !positive(previous.runAttempt) || previous.job !== 'nightly') throw new Error('Host issue lookup failed: malformed invocation identity');
        return previous;
      });


      const root = '/repos/' + input.repository;
      const get = async path => {
        let reply;
        try { reply = await request(path); } catch { throw new Error('Host issue lookup failed: transport'); }
        if (reply?.status !== 200 || reply.link) throw new Error('Host issue lookup failed: status or incomplete pagination');
        return reply.body;
      };
      const lookup = await get(root + '/issues?state=open&labels=host-tier&per_page=100');
      const issueShape = issue => issue && Number.isSafeInteger(issue.number) && issue.number > 0 && typeof issue.title === 'string' && ['open', 'closed'].includes(issue.state) && Array.isArray(issue.labels) && issue.labels.every(label => typeof label?.name === 'string');
      if (!Array.isArray(lookup) || lookup.length > 100 || !lookup.every(issueShape)) throw new Error('Host issue lookup failed: incomplete list');

      const description = input.report_state === 'valid'
        ? names.length ? 'Failed tests: ' + JSON.stringify(names) : 'Host step failed without a reported test failure.'
        : 'JUnit report is ' + input.report_state + '; failed-test names are unavailable.';
      const record = '## T4 host failure\n\nRun: https://github.com/' + input.repository + '/actions/runs/' + input.runId
        + '\nCommit: ' + source.sha + '\nHost: ' + JSON.stringify(key) + '\n' + description + '\n\n' + marker + '\n';
      const matches = lookup.filter(issue => !issue.pull_request && issue.state === 'open' && issue.title === 'Host tier: ' + key && issue.labels.some(label => label.name === 'host-tier'));
      if (matches.length > 1) throw new Error('Host issue lookup found duplicate issues: ' + matches.map(issue => issue.number).join(', '));
      if (matches.length > 0) {
        const issue = matches[0];
        const detail = await get(root + '/issues/' + issue.number);
        const comments = await get(root + '/issues/' + issue.number + '/comments?per_page=100');
        if (!issueShape(detail) || detail.number !== issue.number || detail.state !== 'open' || detail.title !== issue.title || !detail.labels.some(label => label.name === 'host-tier') || typeof detail.body !== 'string'
          || !Number.isSafeInteger(detail.comments) || detail.comments < 0 || !Array.isArray(comments) || comments.length > 100 || comments.length !== detail.comments
          || !comments.every(comment => positive(comment?.id) && typeof comment.body === 'string')) throw new Error('Host issue lookup failed: incomplete raw identity records');
        const previous = [detail.body, ...comments.map(comment => comment.body)].flatMap(recorded);
        if (previous.some(identity => ['repository', 'runId', 'runAttempt', 'job'].every(key => identity[key] === invocation[key]))) return { state: 'already-recorded', issue: issue.number };
        let comment;
        try { comment = await request(root + '/issues/' + issue.number + '/comments', { method: 'POST', body: { body: record } }); }
        catch { throw new Error('Host issue #' + issue.number + ' comment response uncertain; reconcile by reading before replay'); }
        if (comment?.status !== 201 || !Number.isSafeInteger(comment.body?.id) || comment.body.id <= 0) throw new Error('Host issue #' + issue.number + ' comment failed (HTTP ' + comment?.status + ')');
        return { state: 'commented', issue: issue.number, comment: comment.body.id, url: comment.body.html_url };
      }
      let response;
      try { response = await request(root + '/issues', { method: 'POST', body: { title: 'Host tier: ' + key, labels: ['host-tier'], body: record } }); }
      catch { throw new Error('Host issue create response uncertain; reconcile by reading before replay'); }
      if (response?.status !== 201 || !Number.isSafeInteger(response.body?.number) || response.body.number <= 0) throw new Error('Host issue create failed (HTTP ' + response?.status + ')');

      return { state: 'created', issue: response.body.number, url: response.body.html_url };
    }

    export function runtimeRecordInput(env = process.env) {
      let outputs;
      try { outputs = JSON.parse(env.CI_RECORD_INPUT); } catch { throw new Error('Host record transport missing or malformed'); }
      return { ...outputs, event: env.GITHUB_EVENT_NAME, ref: env.GITHUB_REF, repository: env.GITHUB_REPOSITORY,
        runId: Number(env.GITHUB_RUN_ID), runAttempt: Number(env.GITHUB_RUN_ATTEMPT), job: 'nightly' };
    }
    if (process.env.CI_RECORD_ACTION === 'run') {
      try { console.log(JSON.stringify(await recordHostFailure({ input: runtimeRecordInput() }))); }
      catch (error) { console.error(error.message); process.exitCode = 1; }
    }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.policy.outputs.runner }}
      mode: ${{ steps.policy.outputs.mode }}
      demoNeeded: ${{ steps.policy.outputs.demoNeeded }}
      journalOnly: ${{ steps.policy.outputs.journalOnly }}
      sha: ${{ steps.policy.outputs.sha }}
      tree: ${{ steps.policy.outputs.tree }}
      snapshot: ${{ steps.policy.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - run: node --input-type=module -e "$CI_POLICY"
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          CI_POLICY_ACTION: plan
          CI_MACOS_RUNNER: ${{ vars.MACOS_RUNNER }}
  fast:
    needs: [plan]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.mode != 'MAIN_FULL' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - run: node --input-type=module -e "$CI_POLICY"
        env:
          GH_TOKEN: ${{ github.token }}
          CI_POLICY_ACTION: worker
          CI_EXPECTED_SOURCE: ${{ needs.plan.outputs.snapshot }}
          CI_EXPECTED_MODE: ${{ needs.plan.outputs.mode }}
          CI_WORKER: ${{ github.job }}
      - run: npm ci
      - run: node .github/scripts/check-test-list-growth.mjs
      - run: npm test
      - run: npm run budget:package
      - run: npm run budget:instructions
      - run: npm run lint:spec-style
      - run: npm run check:references
      - run: npm run check:paths
      - run: npm run check:ids
      - run: npm run check:words
      - run: npm run check:headers
      - run: npm run matrix:check
  full_ordinary:
    needs: [plan]
    if: ${{ needs.plan.outputs.mode == 'BROAD_EXECUTED' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - run: node --input-type=module -e "$CI_POLICY"
        env:
          GH_TOKEN: ${{ github.token }}
          CI_POLICY_ACTION: worker
          CI_EXPECTED_SOURCE: ${{ needs.plan.outputs.snapshot }}
          CI_EXPECTED_MODE: ${{ needs.plan.outputs.mode }}
          CI_WORKER: ${{ github.job }}
      - run: npm ci
      - run: npm test
  full_host:
    needs: [plan]
    if: ${{ needs.plan.outputs.mode == 'BROAD_EXECUTED' }}
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    outputs:
      host_outcome: ${{ steps.host_tests.outputs.host_outcome }}
      host_exit_code: ${{ steps.host_tests.outputs.host_exit_code }}
      host_invoked: ${{ steps.host_tests.outcome != '' && steps.host_tests.outcome != 'skipped' }}
      host_key: ${{ steps.host_tests.outputs.host_key }}
