      }, read: async () => {
        if (reportError) throw reportError;
        return reportBytes;
      } });
      const fields = {
        host_outcome: result.host.outcome, host_exit_code: String(result.host.exitCode), host_invoked: 'true',
        host_key: JSON.stringify(result.hostKey ?? null), report_state: result.reporting.state,
        names_state: result.reporting.state === 'valid' ? 'available' : 'unavailable',
        failed_names: JSON.stringify(result.reporting.state === 'valid' ? result.reporting.failedNames : null),
        source: env.CI_HOST_SOURCE,
        invocation: JSON.stringify({ repository: env.GITHUB_REPOSITORY, runId: Number(env.GITHUB_RUN_ID), runAttempt: Number(env.GITHUB_RUN_ATTEMPT), job: env.GITHUB_JOB }),
