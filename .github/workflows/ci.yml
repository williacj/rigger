            ? { state: 'incomplete', reason: 'read-error' }
            : stdoutEnded ? { state: 'complete' } : { state: 'incomplete', reason: 'truncated' };
          resolve({ pid: child.pid, exitCode: hostExitCode, signal: hostSignal, stdout: Buffer.concat(stdout), stderr: Buffer.concat(stderr), stdoutCapture,
            ioFailures: [...(startFailure ? [{ stream: 'capture', operation: 'start' }] : []), ...(stdoutReadError ? [{ stream: 'stdout', operation: 'read' }] : []), ...(stderrReadError ? [{ stream: 'stderr', operation: 'read' }] : []), ...(stdoutWriteError ? [{ stream: 'stdout', operation: 'write' }] : []), ...(stderrWriteError ? [{ stream: 'stderr', operation: 'write' }] : [])],
            ...(profile ? { startup: { ...profile, capture: stdoutCapture } } : {}) });
