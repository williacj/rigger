        });
        parser.on('closetag', tag => { parents.pop(); if (tag.name === 'testcase') current = undefined; });
        const textContent = value => {
          if (['testsuites', 'testsuite', 'testcase'].includes(parents.at(-1)) && /[^\t\r\n ]/.test(value)) throw new Error('Unexpected JUnit text');
        };
        parser.on('text', textContent);
        parser.on('cdata', textContent);
        parser.write(new TextDecoder('utf-8', { fatal: true }).decode(bytes)).close();
        failedNames = cases.filter(entry => entry.failed).map(entry => entry.name);
      } catch {
        return finish({ state: 'unparsable', outcome: 'failure', message: 'Host JUnit report is unparsable' });
      }
      return finish({ state: 'valid', outcome: 'success', failedNames });
    }
    const HOST_OUTPUT_FIELDS = ['host_outcome', 'host_exit_code', 'host_invoked', 'host_key', 'report_state', 'names_state', 'failed_names', 'source', 'invocation', 'eligible'];
    export function hostOutputText(fields, names = HOST_OUTPUT_FIELDS) {
      return names.map(name => {
        if (typeof fields[name] !== 'string') throw new Error('Host transport field unavailable: ' + name);
        return name + '=' + fields[name] + '\n';
      }).join('');
    }
    export async function runHost(options = {}) {
      const { env = process.env, append = appendFile, execute, read = readFile,
        save = async (path, bytes) => { await mkdir(dirname(path), { recursive: true }); await writeFile(path, bytes); } } = options;
      const evidence = join(env.RUNNER_TEMP, 'host-report-evidence');
      let reportBytes, reportError;
      const result = await invokeHost({ ...options, execute: async () => {
        const child = await (execute ? execute() : executeScript({ onStart: (info, startup) => save(join(evidence, 'host-start.json'), JSON.stringify({
          ...info, startup: startup ?? null, startedAt: new Date().toISOString(), node: process.version, execPath: process.execPath, cwd: process.cwd(),
          env: Object.fromEntries(['PATH', 'HOME', 'NODE_OPTIONS', 'RUNNER_TEMP', 'GITHUB_EVENT_NAME', 'GITHUB_REF', 'GITHUB_SHA', 'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'CI_HOST_REPORT_NAME', 'CI_HOST_SOURCE', 'CI_HOST_ELIGIBLE'].map(name => [name, env[name] ?? null])),
        })) }));
        const native = { pid: child.pid, exitCode: child.exitCode, signal: child.signal ?? null,
          stdoutCapture: child.stdoutCapture ?? options.startup?.capture, startup: child.startup ?? options.startup,
          ioFailures: child.ioFailures ?? [], node: process.version, execPath: process.execPath, source: env.CI_HOST_SOURCE,
          stdoutBytes: child.stdout.length, stderrBytes: child.stderr.length,
