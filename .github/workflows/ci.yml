      - name: Keep invocation JUnit report
        if: ${{ always() && steps.host_tests.outputs.report_state == 'valid' && steps.host_tests.outputs.host_key != 'null' && steps.host_tests.outputs.host_key != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: host-junit-${{ fromJSON(steps.host_tests.outputs.host_key) }}
          path: ${{ runner.temp }}/host-tests.junit.xml
          if-no-files-found: error
      - name: Keep host invocation originals
        if: ${{ always() && steps.host_tests.outcome != '' && steps.host_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: host-invocation-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/host-report-evidence
          if-no-files-found: error
      - run: npm run budget:package
      - run: npm run budget:instructions
      - run: npm run lint:spec-style
      - run: npm run check:references
      - run: npm run check:paths
      - run: npm run check:ids
      - run: npm run check:words
      - run: npm run check:headers
      - run: npm run matrix:check
  host-record:
    needs: [nightly]
    if: ${{ always() && github.event_name == 'schedule' && needs.nightly.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      group: ci-host-record
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - run: node --input-type=module -e "$CI_RECORD"
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RECORD_ACTION: run
          CI_RECORD_INPUT: ${{ toJSON(needs.nightly.outputs) }}
