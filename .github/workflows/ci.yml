# ABOUTME: Verifies main pushes, PR events, merge groups, schedules and main dispatch; guards older-head cancellation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  merge_group:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CI_POLICY: |
