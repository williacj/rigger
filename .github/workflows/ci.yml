      }
      let failedNames;
      try {
        const parser = new SaxesParser({ fragment: false });
        parser.on('doctype', () => { throw new Error('JUnit DOCTYPE is forbidden'); });
        const cases = [], parents = [];
        const children = { testsuites: ['testsuite', 'testcase'], testsuite: ['testsuite', 'testcase'], testcase: ['failure', 'error', 'skipped'], failure: [], error: [], skipped: [] };
        let current;
        parser.on('opentag', tag => {
          if (parents.length === 0 ? tag.name !== 'testsuites' : !children[parents.at(-1)]?.includes(tag.name)) throw new Error('Unexpected JUnit element');
          parents.push(tag.name);
          if (tag.name === 'testcase') {
            if (typeof tag.attributes.name !== 'string') throw new Error('JUnit testcase name is missing');
            current = { name: tag.attributes.name, failed: false }; cases.push(current);
          }
