# ABOUTME: The workflow that runs Rigger's suite, its two budget checks, its document checks, its
# ruled-out-word check and its test-matrix check, on every push, every pull request and every
# merge a queue is testing.

name: CI

on:
  push:
  pull_request:
  # A queue entry is a temporary branch nobody pushed and no pull request points at, so the two
  # triggers above leave it unanswered. A queue requiring `CI / check (20)` and `CI / check (24)`
  # then waits for checks that never start, until the entry times out.
  merge_group:

jobs:
  check:
    # macOS is v0's only host (D13), and Node 20 is the floor the README's Prerequisites set.
    # Both ends of "20 or later" run, so neither end of the promise goes unproven.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          # The suite reads a document at a git ref: absorption-check compares the invariants
          # 755c809 dissolved against the register they became, and only history holds them.
          # checkout defaults to a depth of 1, where that ref is unreachable and the test reds.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run budget:package
      - run: npm run budget:instructions
      - run: npm run lint:spec-style
      - run: npm run check:references
      - run: npm run check:paths
      - run: npm run check:ids
      - run: npm run check:words
      - run: npm run check:headers
      - run: npm run matrix:check
