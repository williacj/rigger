          // A write callback can precede its error event; keep our listener until notification or actual close.
          if (stdoutCallbackError && !stdoutErrorNotified && !stdoutClosed) return;
          if (stderrCallbackError && !stderrErrorNotified && !stderrClosed) return;
          stdoutSink.removeListener?.('error', onStdoutWriteError);
          stdoutSink.removeListener?.('close', onStdoutClose);
          stdoutSink.removeListener?.('drain', resumeStdout);
          stderrSink.removeListener?.('error', onStderrWriteError);
          stderrSink.removeListener?.('close', onStderrClose);
          stderrSink.removeListener?.('drain', resumeStderr);
