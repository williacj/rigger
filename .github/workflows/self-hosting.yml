# ABOUTME: This repository's own self-hosting check: on each event that can change a card's verdict,
# runs the check from the tree fetched at the commit this file was read from, then posts
# `self-hosting` on each head SHA it read, with the gate App's token minted after the check.

# The forge runs this file from the default branch for every event below, whatever a pull
# request's base, and never from its head. The scripts it runs come from the same commit as this
# file, and the lists they rule by from the default branch's head at the run's start. It does not
# ship: the gate workflow's template is the consumer's.
name: self-hosting

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [edited, labeled, unlabeled]

# The job token reads and never writes: the status is posted with the gate App's token alone.
permissions:
  contents: read
  issues: read
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  # The Node major the check runs on: one `engines` admits, and past no end of life.
  NODE_MAJOR: '24'
  # The tree the scripts run from, under the runner's temporary directory: this repository at the
  # commit this file was read from.
  TREE: self-hosting-tree
  # The event's issue or pull request number, and whether it is a pull request's.
  NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
  IS_PULL: ${{ github.event.pull_request != null || github.event.issue.pull_request != null }}

jobs:
  # Resolves the card the event concerns, which keys the posting job's concurrency group. It reads
  # nothing the posting job rules on, so a run waiting in the group reads its facts once it starts.
  card:
    name: Resolve the card
    runs-on: macos-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      card: ${{ steps.card.outputs.card }}
    steps:
      - name: Check the Node version
        run: |
          running="$(node --version)"
          echo "node ${running}; this workflow names Node ${NODE_MAJOR}"
          major="${running#v}"
          major="${major%%.*}"
          if [ "${major}" -lt "${NODE_MAJOR}" ]; then
            echo "::error::the runner's Node ${running} is below Node ${NODE_MAJOR}, which this workflow names"
            exit 1
          fi
      - name: Fetch the tree this workflow was read from
        run: |
          mkdir -p "${RUNNER_TEMP}/${TREE}"
          curl -sSfL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_WORKFLOW_SHA}" | tar -xzf - --strip-components 1 -C "${RUNNER_TEMP}/${TREE}"
      - name: Resolve the card
        id: card
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "${RUNNER_TEMP}/${TREE}/scripts/gate-check.mjs" card >> "${GITHUB_OUTPUT}"

  # Rules on each pull request the event concerns and posts on each head it read. One card's runs
  # go one at a time, and none is cancelled, so the last starts after the last event and posts last.
  # Its group is keyed on this workflow's name, so it never queues behind the gate workflow's.
  check:
    name: Check and post
    needs: card
    runs-on: macos-latest
    environment: gate
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: ${{ github.workflow }}-${{ needs.card.outputs.card }}
      cancel-in-progress: false
    env:
      GROUP: ${{ github.workflow }}-${{ needs.card.outputs.card }}
      CARD: ${{ needs.card.outputs.card }}
    steps:
      - name: Log the group and the start
        run: echo "concurrency group ${GROUP}; started $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Check the Node version
        run: |
          running="$(node --version)"
          echo "node ${running}; this workflow names Node ${NODE_MAJOR}"
          major="${running#v}"
          major="${major%%.*}"
          if [ "${major}" -lt "${NODE_MAJOR}" ]; then
            echo "::error::the runner's Node ${running} is below Node ${NODE_MAJOR}, which this workflow names"
            exit 1
          fi
      - name: Fetch the tree this workflow was read from
        run: |
          mkdir -p "${RUNNER_TEMP}/${TREE}"
          curl -sSfL "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_WORKFLOW_SHA}" | tar -xzf - --strip-components 1 -C "${RUNNER_TEMP}/${TREE}"
      - name: Map the event to its pull requests
        id: map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node "${RUNNER_TEMP}/${TREE}/scripts/gate-check.mjs" map > "${RUNNER_TEMP}/self-hosting-pulls"
          cat "${RUNNER_TEMP}/self-hosting-pulls"
          echo "pulls=$(tr '\n' ' ' < "${RUNNER_TEMP}/self-hosting-pulls" | sed 's/ *$//')" >> "${GITHUB_OUTPUT}"
      - name: Run the self-hosting check on each pull request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PULLS: ${{ steps.map.outputs.pulls }}
        run: |
          : > "${RUNNER_TEMP}/self-hosting-results"
          unread=0
          for pull in ${PULLS}; do
            ruled="${RUNNER_TEMP}/self-hosting-${pull}"
            status=0
            node "${RUNNER_TEMP}/${TREE}/.github/scripts/self-hosting-check.mjs" "${pull}" > "${ruled}" || status=$?
            cat "${ruled}"
            cat "${ruled}" >> "${GITHUB_STEP_SUMMARY}"
            head="$(sed -n 's/^head: //p' "${ruled}" | head -n 1)"
            if [ -z "${head}" ]; then
              echo "::error::pull request #${pull} could not be read, so nothing is posted for this event"
              unread=1
              continue
            fi
            reason="$(sed -n 's/^refused: //p' "${ruled}" | head -n 1)"
            printf '%s\t%s\t%s\n' "${head}" "${status}" "${reason}" >> "${RUNNER_TEMP}/self-hosting-results"
          done
          exit "${unread}"
      - name: Mint the gate App's token
        id: mint
        if: success() && steps.map.outputs.pulls != ''
        env:
          GATE_APP_ID: ${{ vars.GATE_APP_ID }}
          GATE_APP_PRIVATE_KEY: ${{ secrets.GATE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          field() { node -e 'let s = ""; process.stdin.on("data", (d) => { s += d; }).on("end", () => { console.log(JSON.parse(s)[process.argv[1]]); })' "$1"; }
          api() { curl -sSf -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$@"; }
          now="$(date +%s)"
          header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64)"
          claims="$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "${GATE_APP_ID}" | b64)"
          signature="$(printf '%s.%s' "${header}" "${claims}" | openssl dgst -sha256 -sign <(printf '%s\n' "${GATE_APP_PRIVATE_KEY}") | b64)"
          jwt="${header}.${claims}.${signature}"
          echo "::add-mask::${jwt}"
          installation="$(api -H "Authorization: Bearer ${jwt}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/installation" | field id)"
          token="$(api -X POST -H "Authorization: Bearer ${jwt}" "https://api.github.com/app/installations/${installation}/access_tokens" -d "{\"repositories\":[\"${GITHUB_REPOSITORY#*/}\"],\"permissions\":{\"statuses\":\"write\"}}" | field token)"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"
      - name: Post self-hosting on each head the check read
        if: success() && steps.map.outputs.pulls != ''
        env:
          CONTEXT: self-hosting
          TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r head status reason; do
            body="$(STATUS="${status}" REASON="${reason}" node -e '
              const state = process.env.STATUS === "0" ? "success" : "failure";
              const reason = [...process.env.REASON].slice(0, 140).join("");
              const description = state === "success" ? "no listed path or authored document is touched without a sound owner marker at this head" : reason || "the self-hosting check refused this head";
              console.log(JSON.stringify({ state, context: process.env.CONTEXT, description }));
            ')"
            curl -sSf -X POST -H "Authorization: Bearer ${TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${head}" -d "${body}" > /dev/null
            echo "posted ${body} on ${head}"
          done < "${RUNNER_TEMP}/self-hosting-results"
      - name: Log the end
        if: always()
        run: echo "concurrency group ${GROUP}; ended $(date -u +%Y-%m-%dT%H:%M:%SZ)"
